name: Release

# Push a tag like v0.5.2 and this publishes the GitHub release, with the notes from CHANGELOG.md and roost_quatt.zip (the
# integration folder, for installing by hand). The beta (0.x, and versions like 1.0.0b1) is published as a pre-release;
# HACS only offers those to who turned on "Show beta versions" for Roost.
# It refuses when the tag does not match the version in manifest.json or the changelog has no section for it.
# Run it by hand (Actions → Release → Run workflow) to rewrite the notes and zip of a release, or to publish one whose
# tag is there but whose release is missing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to (re)publish, e.g. v0.5.2"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Check the version and take the release notes from the changelog
        id: notes
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          version="$(python3 -c 'import json;print(json.load(open("custom_components/roost_quatt/manifest.json"))["version"])')"
          if [ "v${version}" != "${tag}" ]; then
            echo "::error::Tag ${tag} does not match manifest.json version ${version}"; exit 1
          fi
          python3 .github/scripts/release_notes.py "${tag}" > notes.md
          echo "title=$(head -n 1 notes.md)" >> "$GITHUB_OUTPUT"
          tail -n +3 notes.md > body.md
          # the beta (0.x) as pre-releases: HACS offers them to who turned on "Show beta versions" for Roost
          case "${version}" in 0.*|*[ab]*|*rc*) echo "pre=--prerelease" >> "$GITHUB_OUTPUT" ;; *) echo "pre=--latest" >> "$GITHUB_OUTPUT" ;; esac
      - name: Zip the integration
        run: cd custom_components/roost_quatt && zip -r -q "${GITHUB_WORKSPACE}/roost_quatt.zip" . -x "__pycache__/*"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
          TITLE: ${{ steps.notes.outputs.title }}    # through the environment: quotes in a title stay text
          PRE: ${{ steps.notes.outputs.pre }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              gh release edit "${TAG}" --title "${TITLE}" --notes-file body.md
              gh release upload "${TAG}" roost_quatt.zip --clobber
            else
              echo "Release ${TAG} exists already, leaving it"
            fi
          else
            gh release create "${TAG}" --title "${TITLE}" --notes-file body.md ${PRE} roost_quatt.zip
          fi
